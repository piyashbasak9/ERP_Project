[tool.ruff.lint.per-file-ignores]
# ERP is the established Django package/import path; changing its case breaks imports.
"ERP/__init__.py" = ["N999"]

# Django model, form, and migration metadata intentionally uses list/dict class attributes.
"core/**/models.py" = ["RUF012"]
"core/**/forms.py" = ["RUF012"]
"core/**/migrations/*.py" = ["RUF012"]
