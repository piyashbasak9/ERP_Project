{% extends 'base.html' %}
{% block title %}Collection sheets{% endblock %}
{% block content %}
<div class="container-fluid py-3">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div><span class="eyebrow">COLLECTIONS</span><h1 class="h3 mb-0">Collection sheets</h1></div>
        <a class="btn btn-primary" href="{% url 'collections:Module_Collections_sheet_generate' %}?popup=1" data-popup data-popup-title="Generate collection sheet">Generate sheet</a>
    </div>
    <div class="card card-body mb-3">
        <div class="row g-2">
            <div class="col-md-6"><label class="form-label" for="collection-search">Search</label><input id="collection-search" class="form-control" type="search"></div>
            <div class="col-md-3"><label class="form-label" for="collection-status">Status</label><select id="collection-status" class="form-select"><option value="">All statuses</option>{% for key, label in statuses %}<option value="{{ key }}" {% if selected_status == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
        </div>
    </div>
    <div class="table-responsive"><table id="collectionGrid"></table></div>
    <div id="collectionPager"></div>
</div>
{% endblock %}
{% block extra_js %}
<script>
$(function () {
    const grid = $("#collectionGrid");
    grid.jqGrid({
        url: "{% url 'collections:Module_Collections_sheet_list' %}",
        datatype: "json",
        mtype: "GET",
        postData: {format: "json"},
        colModel: [
            {name: "id", key: true, hidden: true},
            {label: "Date", name: "collection_date", width: 100},
            {label: "Center", name: "center", width: 160},
            {label: "Group", name: "group", width: 120},
            {label: "Field officer", name: "field_officer", width: 160},
            {label: "Status", name: "status", width: 100},
            {label: "Collected", name: "total_collected", width: 110, align: "right"},
            {
                label: "Open", name: "detail_url", width: 80, sortable: false,
                formatter: value => '<a class="btn btn-sm btn-outline-primary" href="' + encodeURI(value) + '">Open</a>'
            }
        ],
        jsonReader: {root: "rows", page: "page", total: "total", records: "records", repeatitems: false, id: "id"},
        pager: "#collectionPager",
        rowNum: 25,
        rowList: [25, 50, 100],
        viewrecords: true,
        autowidth: true,
        height: "auto",
        autoencode: true,
        sortname: "collection_date",
        sortorder: "desc"
    });
    const refresh = () => grid.jqGrid("setGridParam", {
        page: 1,
        postData: {
            format: "json",
            searchString: $("#collection-search").val(),
            status: $("#collection-status").val()
        }
    }).trigger("reloadGrid");
    $("#collection-search").on("input", refresh);
    $("#collection-status").on("change", refresh);
});
</script>
{% endblock %}
