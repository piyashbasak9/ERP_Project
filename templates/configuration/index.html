{% extends 'base.html' %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="container-fluid py-3">
    <div class="mb-3"><span class="eyebrow">ADMINISTRATION</span><h1 class="h3">Settings</h1></div>
    <div class="row g-3">
        {% for screen in screens %}
        <div class="col-md-6 col-xl-3">
            <div class="card card-body h-100">
                <h2 class="h5">{{ screen.title }}</h2>
                <a class="btn btn-outline-primary mt-auto" href="{{ screen.url }}?popup=1" data-popup data-popup-title="{{ screen.title }}">Open</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
