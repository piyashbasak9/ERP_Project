{% extends 'base.html' %}
{% block title %}Edit Role{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="form-page-heading">
            <span class="eyebrow">ACCESS CONTROL</span>
            <h2>Edit role</h2>
            <p>Manage the role name and allowed pages.</p>
        </div>
        <div class="card form-card">
            <div class="card-header">
                <h4 class="mb-0">Role details · {{ role.name }}</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.name.id_for_label }}" class="form-label">{{ form.name.label }}</label>
                        {{ form.name }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ form.url_permissions.label }}</label>
                        <div class="url-grid" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; max-height:400px; overflow-y:auto; border:1px solid #ddd; padding:15px; border-radius:8px;">
                            {{ form.url_permissions }}
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check2 me-2"></i>Save changes</button>
                    <a href="{% url 'accounts:Module_Auth_list_roles' %}" class="btn btn-outline-secondary" data-popup-close>Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
