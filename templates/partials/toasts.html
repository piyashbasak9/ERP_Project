<div id="toastContainer" class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1100" aria-live="polite" aria-atomic="true">
    {% for message in messages %}
    <div class="toast align-items-center text-bg-{{ message.tags }} border-0" role="status" data-bs-delay="5000">
        <div class="d-flex">
            <div class="toast-body">{{ message }}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
    {% endfor %}
</div>
