{% if page_obj.has_other_pages %}
<nav class="mt-3" aria-label="Pagination">
    <ul class="pagination justify-content-center">
        {% if page_obj.has_previous %}
        <li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if search %}&amp;q={{ search|urlencode }}{% endif %}{% if selected_status %}&amp;status={{ selected_status|urlencode }}{% endif %}{% if account_number %}&amp;account={{ account_number|urlencode }}{% endif %}">Previous</a></li>
        {% else %}<li class="page-item disabled"><span class="page-link">Previous</span></li>{% endif %}
        <li class="page-item disabled"><span class="page-link">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span></li>
        {% if page_obj.has_next %}
        <li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}{% if search %}&amp;q={{ search|urlencode }}{% endif %}{% if selected_status %}&amp;status={{ selected_status|urlencode }}{% endif %}{% if account_number %}&amp;account={{ account_number|urlencode }}{% endif %}">Next</a></li>
        {% else %}<li class="page-item disabled"><span class="page-link">Next</span></li>{% endif %}
    </ul>
</nav>
{% endif %}
