{% extends 'base.html' %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="access-denied-wrap">
    <div class="card access-denied-card">
        <div class="card-body text-center">
            <span class="access-denied-icon"><i class="bi bi-shield-lock"></i></span>
            <span class="eyebrow">PERMISSION REQUIRED</span>
            <h1>Access unavailable</h1>
            <p>{{ message|default:'You do not have permission to view this page.' }}</p>
            <a href="/" class="btn btn-primary">
                <i class="bi bi-arrow-left me-2"></i>Return to dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
