{% extends 'base.html' %}
{% load static %}
{% block title %}Savings products{% endblock %}
{% block content %}
<div class="container-fluid py-3" id="savingsProductGridConfig"
     data-products-url="{% url 'savings:Module_Savings_products' %}"
     data-edit-url="{% url 'savings:Module_Savings_product_edit' 0 %}"
     data-activate-url="{% url 'savings:Module_Savings_product_activate' 0 %}"
     data-deactivate-url="{% url 'savings:Module_Savings_product_deactivate' 0 %}">
    <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
        <div><span class="eyebrow">SAVINGS</span><h1 class="h3 mb-0">Savings products</h1></div>
        <a class="btn btn-primary" href="{% url 'savings:Module_Savings_product_add' %}?popup=1" data-popup data-popup-title="Create savings product">Create product</a>
    </div>
    <div class="card card-body mb-3">
        <div class="row g-2">
            <div class="col-md-6"><label class="form-label" for="savings-product-search">Search</label><input id="savings-product-search" class="form-control" type="search"></div>
            <div class="col-md-3"><label class="form-label" for="savings-product-status">Status</label><select id="savings-product-status" class="form-select"><option value="">All statuses</option><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
        </div>
    </div>
    <table id="savingsProductGrid"></table>
    <div id="savingsProductPager"></div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/savings-product-grid.js' %}"></script>
{% endblock %}
