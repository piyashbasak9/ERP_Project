{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Action complete · ERP Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="popup-complete-body">
    <main class="popup-complete-card">
        <span class="popup-complete-icon"><i class="bi bi-check2"></i></span>
        <span class="eyebrow">ERP MANAGEMENT</span>
        <h1>All set</h1>
        <p>{{ completion_message }}</p>
    </main>
    <script>
        if (window.parent !== window) {
            window.parent.postMessage('erp-popup-complete', window.location.origin);
        }
    </script>
</body>
</html>
