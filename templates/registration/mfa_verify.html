{% extends 'base.html' %}
{% block title %}Verify multi-factor authentication{% endblock %}
{% block content %}
<main class="container py-4">
    <h1 class="h3">Verify your identity</h1>
    <p>Enter an authenticator code or an unused recovery code to continue.</p>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next_url }}">
        <label class="form-label" for="mfa-token">Authenticator or recovery code</label>
        <input class="form-control" id="mfa-token" name="token" autocomplete="one-time-code" required>
        <button class="btn btn-primary mt-3" type="submit">Verify</button>
    </form>
</main>
{% endblock %}
