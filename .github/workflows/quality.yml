name: Quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production-6d10bbad3a9dcf1c0ae4f0e2b
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost
      DB_NAME: erp_test
      DB_USER: erp_test_runner
      DB_PASSWORD: test-only-erp-db-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TEST_DB_NAME: erp_test
      TEST_DB_USER: erp_test_runner
      TEST_DB_PASSWORD: test-only-erp-db-password
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "5432"
      RUNTIME_DB_USER: erp_runtime
      RUNTIME_DB_PASSWORD: test-only-runtime-password
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
      - name: Install PostgreSQL and test utilities
        run: |
          sudo apt-get update
          sudo apt-get install --yes age postgresql-16 postgresql-client-16
          sudo systemctl start postgresql
          sudo -u postgres createdb erp_test
      - name: Create isolated PostgreSQL roles
        run: |
          sudo --preserve-env=TEST_DB_USER,TEST_DB_PASSWORD,RUNTIME_DB_USER,RUNTIME_DB_PASSWORD \
            -u postgres psql --dbname=postgres --set=ON_ERROR_STOP=1 \
            --file=database/ci_test_roles.sql
      - name: Install dependencies and checks
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-django ruff bandit pip-audit
      - name: Run PostgreSQL test suite
        run: pytest -vv --tb=long --color=no --strict-config --strict-markers
      - name: Verify encrypted backup and restore on scratch databases
        env:
          DB_USER: erp_test_runner
          DB_PASSWORD: test-only-erp-db-password
          DB_OWNER_USER: erp_test_runner
          DB_OWNER_PASSWORD: test-only-erp-db-password
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_SSLMODE: prefer
        run: scripts/test-backup-restore.sh
      - name: Run Ruff
        run: ruff check .
      - name: Run Bandit
        run: bandit -r core ERP -x '*/tests.py,*/test_*.py'
      - name: Audit dependencies
        run: pip-audit
      - name: Check deployment settings
        env:
          DJANGO_SECRET_KEY: ci-only-not-for-production-6d10bbad3a9dcf1c0ae4f0e2b
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: localhost
          REDIS_URL: redis://localhost:6379/0
          DB_SSLMODE: require
        run: python manage.py check --deploy
      - name: Install Gitleaks
        run: |
          go install github.com/gitleaks/gitleaks/v8@v8.24.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scan repository history for secrets
        run: gitleaks git --log-opts=--all --redact

  deploy-test:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test-and-scan
    runs-on: [self-hosted, linux, test]
    environment:
      name: test
    steps:
      - uses: actions/checkout@v4
      - name: Deploy reviewed release after environment approval
        run: sudo -n "$GITHUB_WORKSPACE/deploy/release.sh" "$GITHUB_SHA" "$GITHUB_WORKSPACE"
