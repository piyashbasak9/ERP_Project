name: Quality gates

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
      DJANGO_SECRET_KEY: ci-only-not-for-production-6d10bbad3a9dcf1c0ae4f0e2b
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost
      DB_NAME: erp_test
      DB_USER: erp_test_runner
      DB_PASSWORD: test-only-erp-db-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TEST_DB_NAME: erp_test
      TEST_DB_USER: erp_test_runner
      TEST_DB_PASSWORD: test-only-erp-db-password
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "5432"
      RUNTIME_DB_USER: erp_runtime
      RUNTIME_DB_PASSWORD: test-only-runtime-password
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked local settings
        run: |
          if git ls-files | grep -Eq '(^|/)local_settings\.py$'; then
            echo "A development-only local_settings.py is tracked." >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
      - name: Install PostgreSQL and test utilities
        run: |
          sudo apt-get update
          sudo apt-get install --yes age postgresql-16 postgresql-client-16
          sudo systemctl start postgresql
          sudo -u postgres createdb erp_test
      - name: Create isolated PostgreSQL roles
        run: |
          sudo --preserve-env=TEST_DB_USER,TEST_DB_PASSWORD,RUNTIME_DB_USER,RUNTIME_DB_PASSWORD \
            -u postgres psql --dbname=postgres --set=ON_ERROR_STOP=1 \
            --file=database/ci_test_roles.sql
      - name: Install dependencies and checks
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-django ruff bandit pip-audit
      - name: Run PostgreSQL test suite
        run: pytest -vv --tb=long --color=no --strict-config --strict-markers
      - name: Verify encrypted backup and restore on scratch databases
        env:
          DB_USER: erp_test_runner
          DB_PASSWORD: test-only-erp-db-password
          DB_OWNER_USER: erp_test_runner
          DB_OWNER_PASSWORD: test-only-erp-db-password
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_SSLMODE: prefer
        run: scripts/test-backup-restore.sh
      - name: Run Ruff
        run: ruff check .
      - name: Run Bandit
        run: bandit -r core ERP -x '*/tests.py,*/test_*.py'
      - name: Audit dependencies
        run: pip-audit
      - name: Check deployment settings
        env:
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: ci-only-not-for-production-6d10bbad3a9dcf1c0ae4f0e2b
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: localhost
          REDIS_URL: redis://localhost:6379/0
          DB_SSLMODE: require
        run: python manage.py check --deploy
      - name: Install Gitleaks
        run: |
          go install github.com/gitleaks/gitleaks/v8@v8.24.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scan repository history for secrets
        run: gitleaks git --log-opts=--all --redact

  responsive-audit:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
      DJANGO_SECRET_KEY: ci-only-not-for-production-6d10bbad3a9dcf1c0ae4f0e2b
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost
      DB_NAME: erp_test
      DB_USER: erp_test_runner
      DB_PASSWORD: test-only-erp-db-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TEST_DB_NAME: erp_test
      TEST_DB_USER: erp_test_runner
      TEST_DB_PASSWORD: test-only-erp-db-password
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "5432"
      RUNTIME_DB_USER: erp_runtime
      RUNTIME_DB_PASSWORD: test-only-runtime-password
      ERP_RESPONSIVE_STRICT: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create isolated PostgreSQL roles
        env:
          PGPASSWORD: postgres
        run: |
          psql --host=127.0.0.1 --username=postgres --dbname=postgres \
            --set=ON_ERROR_STOP=1 --file=database/ci_test_roles.sql
      - name: Install Django and Playwright dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Install Chromium for pull-request smoke matrix
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium
      - name: Install all Playwright browsers for full matrix
        if: github.event_name != 'pull_request'
        run: npx playwright install --with-deps
      - name: Run UI convention route checks
        run: >-
          python manage.py test
          core.common.tests.UIConventionRegistryTests
          core.common.tests.UIConventionRenderTests
          --verbosity=2
      - name: Run pull-request responsive smoke matrix
        if: github.event_name == 'pull_request'
        env:
          ERP_RESPONSIVE_BROWSERS: chromium
          ERP_RESPONSIVE_VIEWPORTS: >-
            [{"name":"390x844","width":390,"height":844},{"name":"1024x768","width":1024,"height":768},{"name":"1366x768","width":1366,"height":768}]
        run: npm run test:e2e:responsive
      - name: Run full scheduled or manually triggered responsive matrix
        if: github.event_name != 'pull_request'
        run: npm run test:e2e:responsive

  deploy-test:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test-and-scan
    runs-on: [self-hosted, linux, test]
    environment:
      name: test
    steps:
      - uses: actions/checkout@v4
      - name: Deploy reviewed release after environment approval
        run: sudo -n "$GITHUB_WORKSPACE/deploy/release.sh" "$GITHUB_SHA" "$GITHUB_WORKSPACE"
