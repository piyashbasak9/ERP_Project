x-app-environment: &app-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set DJANGO_CSRF_TRUSTED_ORIGINS}
  DB_NAME: ${DB_NAME:?Set DB_NAME}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_SSLMODE: verify-full
  DB_SSL_CA_PATH: /run/db-ca.crt
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  PRIVATE_MEDIA_ROOT: /app/private_media
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2}
  SECURE_PROXY_SSL: "1"
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
  SESSION_ABSOLUTE_TIMEOUT_HOURS: ${SESSION_ABSOLUTE_TIMEOUT_HOURS:-12}
  MFA_REVERIFICATION_SECONDS: ${MFA_REVERIFICATION_SECONDS:-300}
  MFA_FAILURE_LIMIT: ${MFA_FAILURE_LIMIT:-5}
  MFA_COOLOFF_SECONDS: ${MFA_COOLOFF_SECONDS:-900}
  AXES_FAILURE_LIMIT: ${AXES_FAILURE_LIMIT:-5}
  AXES_COOLOFF_MINUTES: ${AXES_COOLOFF_MINUTES:-15}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_ADMIN_USER:?Set DB_ADMIN_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - db_admin_password
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/postgres-server.crt
      - -c
      - ssl_key_file=/run/postgres-server.key
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${DB_TLS_CERT_FILE:?Set DB_TLS_CERT_FILE}:/run/postgres-server.crt:ro
      - ${DB_TLS_KEY_FILE:?Set DB_TLS_KEY_FILE}:/run/postgres-server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped

  db-roles:
    image: postgres:16
    user: postgres
    profiles: ["deployment"]
    environment:
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_ADMIN_USER: ${DB_ADMIN_USER:?Set DB_ADMIN_USER}
      DB_OWNER_USER: ${DB_OWNER_USER:?Set DB_OWNER_USER}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_HOST: postgres
      DB_SSLMODE: verify-full
      DB_SSL_CA_PATH: /run/db-ca.crt
    volumes:
      - ${DB_TLS_CA_FILE:?Set DB_TLS_CA_FILE}:/run/db-ca.crt:ro
      - ./database:/database:ro
    secrets:
      - db_admin_password
    command:
      - /bin/sh
      - -c
      - export PGPASSWORD="$$(cat /run/secrets/db_admin_password)" PGSSLMODE="$$DB_SSLMODE" PGSSLROOTCERT="$$DB_SSL_CA_PATH" && psql --no-password --host=postgres --port=5432 --username="$$DB_ADMIN_USER" --dbname="$$DB_NAME" --file=/database/production_roles.sql
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate:
    image: ${ERP_IMAGE:?Set ERP_IMAGE}
    profiles: ["deployment"]
    environment:
      <<: *app-environment
      DB_USER: ${DB_OWNER_USER:?Set DB_OWNER_USER}
      DB_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD}
    volumes:
      - ${DB_TLS_CA_FILE:?Set DB_TLS_CA_FILE}:/run/db-ca.crt:ro
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  runtime-grants:
    image: postgres:16
    user: postgres
    profiles: ["deployment"]
    environment:
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_ADMIN_USER: ${DB_ADMIN_USER:?Set DB_ADMIN_USER}
      DB_SSLMODE: verify-full
      DB_SSL_CA_PATH: /run/db-ca.crt
    volumes:
      - ${DB_TLS_CA_FILE:?Set DB_TLS_CA_FILE}:/run/db-ca.crt:ro
      - ./database:/database:ro
    secrets:
      - db_admin_password
    command:
      - /bin/sh
      - -c
      - export PGPASSWORD="$$(cat /run/secrets/db_admin_password)" PGSSLMODE="$$DB_SSLMODE" PGSSLROOTCERT="$$DB_SSL_CA_PATH" && psql --no-password --host=postgres --port=5432 --username="$$DB_ADMIN_USER" --dbname="$$DB_NAME" --file=/database/production_runtime_grants.sql
    restart: "no"

  web:
    image: ${ERP_IMAGE:?Set ERP_IMAGE}
    environment:
      <<: *app-environment
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    command:
      - /bin/sh
      - -c
      - python manage.py collectstatic --noinput && exec gunicorn ERP.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -
    volumes:
      - ${DB_TLS_CA_FILE:?Set DB_TLS_CA_FILE}:/run/db-ca.crt:ro
      - static_data:/app/staticfiles
      - private_media:/app/private_media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  celery-worker:
    image: ${ERP_IMAGE:?Set ERP_IMAGE}
    environment:
      <<: *app-environment
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    command: ["celery", "-A", "ERP", "worker", "--loglevel=INFO"]
    volumes:
      - ${DB_TLS_CA_FILE:?Set DB_TLS_CA_FILE}:/run/db-ca.crt:ro
      - private_media:/app/private_media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: ${ERP_IMAGE:?Set ERP_IMAGE}
    environment:
      <<: *app-environment
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    command: ["celery", "-A", "ERP", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    volumes:
      - ${DB_TLS_CA_FILE:?Set DB_TLS_CA_FILE}:/run/db-ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:?Set TLS_CERT_FILE}:/etc/nginx/tls.crt:ro
      - ${TLS_KEY_FILE:?Set TLS_KEY_FILE}:/etc/nginx/tls.key:ro
      - static_data:/app/staticfiles:ro
      - private_media:/app/private_media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  private_media:
  static_data:

secrets:
  db_admin_password:
    file: ${DB_ADMIN_PASSWORD_FILE:?Set DB_ADMIN_PASSWORD_FILE}
